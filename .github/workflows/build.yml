name: Test Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 媒体库相关的安全/配额/迁移测试单独跑一次，不必跟随 7 个构建目标重复执行
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Go test
        run: go test ./internal/db/... ./internal/transcode/... ./internal/media/...

  build:
    strategy:
      matrix:
        target:
          # Fork-only build: Windows x64 is the only distributed target.
          # darwin/linux-android/arm64 targets were dropped because cross-compiling
          # arm64 targets requires zig, installed via snap, which times out on CI.
          - windows-amd64
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: benjlevesque/short-sha@dbe07338b37c456ce06d23409b35a56a7815eef4 # v4.0
        id: short-sha

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"

      - name: Setup web
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      # Fork 自定义前端构建：取代 Setup web 下载的官方 dist。
      # 上游 OpenList-Frontend 的 test/only-mpv 已 rebase 到 v4.2.8（含 media 前端源码），
      # 因此这里构建的产物同时包含官方媒体库/高级种子传输页面 + 本 fork 的两处补丁：
      #   1. zh-CN / zh-TW 中文语言文件（上游不入库，靠 Crowdin secret 生成，fork 没有该 secret）
      #   2. 设置页的 PikPak PAT 离线下载临时目录入口
      - name: Build frontend from source (test branch with forked repo)
        if: ${{ github.repository == 'lilyblessing/OpenList' }}
        run: |
          git clone --branch test/only-mpv --depth 1 https://github.com/lilyblessing/OpenList-Frontend.git frontend-src
          cd frontend-src
          npm install -g pnpm
          pnpm install
          pnpm build
          cd ..
          rm -rf public/dist
          mkdir -p public/dist
          cp -r frontend-src/dist/* public/dist/
          rm -rf frontend-src

      - name: Build
        uses: OpenListTeam/cgo-actions@d760a8ec1a6be1f8ec181229e11cb2671797f9e0 # v1.3.0
        with:
          targets: ${{ matrix.target }}
          flags: ${{ contains(matrix.target, '-musl') && '-ldflags=-linkmode external -extldflags ''-static -fpic''' || '-ldflags=' }}
          static-link-for-musl: true
          musl-target-format: $os-$musl-$arch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@oplist.org>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$tag
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling
          output: openlist$ext

      - name: Verify musl binary is static
        if: contains(matrix.target, '-musl')
        run: |
          set -e
          if readelf -l build/openlist | grep -q "Requesting program interpreter"; then
            echo "Dynamic binary detected: build/openlist"
            readelf -l build/openlist | grep "Requesting program interpreter" || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openlist_${{ steps.short-sha.outputs.sha }}_${{ matrix.target }}
          path: build/*
